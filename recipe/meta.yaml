{% set name = "hierarchicalforecast" %}
{% set version = "1.5.1" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 448b14bf889de36aab50aa1290917dce3c35aa69d29f2c9035222a79e983dbd6

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true  # [py<310]

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
  host:
    - pip
    - python
    - wheel
    - setuptools >=45
    - pybind11 >=2.10
    # $RPATH/libgomp.so.1 not found in packages, sysroot(s) nor the missing_dso_whitelist
    - llvm-openmp {{ cxx_compiler_version }}  # [osx or (win and arm64)]
    - libgomp        # [linux]
    - vcomp14        # [win and x86_64]
  run:
    - python
    - numpy
    - pandas >=2.1.0
    - scikit-learn >=1.2
    - matplotlib-base
    - narwhals >=2.0
    # qpsolvers[clarabel]
    - qpsolvers
    - utilsforecast >=0.2.12

test:
  imports:
    - hierarchicalforecast
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/Nixtla/hierarchicalforecast/tree/main/
  summary: Hierarchical Methods Time series forecasting
  license: Apache-2.0
  license_file: LICENSE
  license_family: Apache
  description: |
    HierarchicalForecast offers a collection of reconciliation methods, 
    including BottomUp, TopDown, MiddleOut, MinTrace and ERM.
  doc_url: https://nixtla.github.io/hierarchicalforecast/
  dev_url: https://github.com/Nixtla/hierarchicalforecast

extra:
  recipe-maintainers:
    - sugatoray
    - AzulGarza
    - jmoralez
    
